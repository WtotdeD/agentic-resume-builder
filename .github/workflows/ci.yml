name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, format, test, build
    runs-on: ubuntu-latest
    env:
      # Every test mocks puppeteer, so the ~170MB Chromium download buys
      # nothing here. The docker job below exercises the real browser.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22-bookworm-slim base.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds and starts through compose rather than plain docker run, so CI
      # exercises the same path install.sh and docs/docker.md document.
      - name: Build and start the container
        run: docker compose up -d --build

      - name: Wait for the container to report healthy
        run: |
          for _ in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' agentic-resume-builder 2>/dev/null || echo unknown)
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            [ "$status" = "unhealthy" ] && break
            sleep 2
          done
          echo "Container never became healthy."
          docker compose logs --no-color
          exit 1

      # Temporary: the smoke test caught a Chromium launch failure that does not
      # reproduce on a host without AppArmor. This drives puppeteer itself inside
      # the container, which is the app's exact launch path, across several flag
      # sets so one run identifies which survives. Remove once fixed.
      - name: Probe puppeteer launch inside the container
        run: |
          set +e
          docker compose exec -T agentic-resume-builder node -e '
            const puppeteer = require("puppeteer");
            const base = ["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage","--disable-gpu"];
            const variants = {
              "baseline": base,
              "+breakpad": [...base, "--disable-breakpad"],
              "+breakpad+nozygote": [...base, "--disable-breakpad", "--no-zygote"],
              "+breakpad+nozygote+singleprocess": [...base, "--disable-breakpad", "--no-zygote", "--single-process"],
            };
            (async () => {
              for (const [name, args] of Object.entries(variants)) {
                try {
                  const b = await puppeteer.launch({ headless: true, args });
                  const p = await b.newPage();
                  await p.goto("about:blank");
                  await b.close();
                  console.log(name + ": OK");
                } catch (e) {
                  console.log(name + ": FAIL -> " + String(e.message).split("\n").slice(0, 6).join(" | "));
                }
              }
            })();
          '
          echo "--- security context ---"
          docker inspect -f 'AppArmor={{.AppArmorProfile}} Seccomp={{.HostConfig.SecurityOpt}} ReadonlyRootfs={{.HostConfig.ReadonlyRootfs}}' agentic-resume-builder
          docker compose exec -T agentic-resume-builder sh -c 'echo TMPDIR=${TMPDIR:-unset}; echo HOME=$HOME; df -h /tmp | tail -1'

      - name: Smoke-test the render route and the PDF export
        run: |
          set -euo pipefail

          # Discovered, never hardcoded, so this keeps working for a fork that
          # replaces resumes/ with its own lenses.
          lens=$(find resumes -maxdepth 1 -name '*.yaml' -o -maxdepth 1 -name '*.yml' \
            | sort | head -1 | xargs -r basename | sed 's/\.[^.]*$//')
          if [ -z "$lens" ]; then
            echo "No lens found in resumes/ — nothing to smoke-test."
            exit 1
          fi
          echo "Smoke-testing lens: $lens"

          code=$(curl -sS -o /dev/null -w '%{http_code}' "http://localhost:3000/render/$lens")
          echo "GET /render/$lens -> $code"
          [ "$code" = "200" ] || exit 1

          code=$(curl -sS -o smoke.pdf -D headers.txt -w '%{http_code}' \
            -X POST "http://localhost:3000/api/export-pdf" \
            -H 'Content-Type: application/json' \
            -d "{\"configName\":\"$lens\"}")
          echo "POST /api/export-pdf -> $code"
          [ "$code" = "200" ] || exit 1

          grep -iq '^content-type: application/pdf' headers.txt || {
            echo "Expected Content-Type: application/pdf, got:"; cat headers.txt; exit 1; }

          # A 200 carrying an empty body would otherwise pass as a green smoke test.
          head -c 4 smoke.pdf | grep -q '%PDF' || { echo "Body is not a PDF."; exit 1; }
          echo "PDF size: $(wc -c < smoke.pdf) bytes"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
