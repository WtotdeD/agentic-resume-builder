services:
  agentic-resume-builder:
    build:
      context: .
    image: agentic-resume-builder:latest
    container_name: agentic-resume-builder
    restart: unless-stopped
    ports:
      # Container port stays 3000 so the PDF route's self-callback URL always
      # matches the listener; change only the host side.
      - '${HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
    volumes:
      # Editing a resume config or a content file takes effect on the next
      # request — both routes render on demand. No rebuild needed.
      - ./content:/app/content:ro
      - ./resumes:/app/resumes:ro

    # Chromium runs with --no-sandbox (it cannot use its own sandbox without
    # relaxing Docker's seccomp filter, which would be a worse trade). These
    # constraints are the compensating control.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Puppeteer writes its user-data-dir here; the rest of the fs is immutable.
      - /tmp:rw,size=512m
      # Chromium derives its crashpad database path from HOME. On a read-only
      # rootfs that path is unwritable, so it hands the crash handler an empty
      # --database and dies on the handler's complaint. Only hosts that apply an
      # AppArmor profile hit it, which is why it surfaced in CI and not locally.
      - /home/node:rw,size=16m,uid=1000,gid=1000,mode=0700
