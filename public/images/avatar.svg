<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Illustrated portrait placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <clipPath id="frame">
      <rect width="200" height="200" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="200" height="200" fill="url(#bg)" />

    <!-- orbital ring, a nod to the persona's interplanetary freight work -->
    <ellipse cx="100" cy="86" rx="70" ry="26" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.55" transform="rotate(-18 100 86)" />

    <!-- shoulders -->
    <path d="M28 200 C28 152 60 130 100 130 C140 130 172 152 172 200 Z" fill="#2563eb" />
    <path d="M100 130 C112 130 122 133 130 138 L118 200 L100 200 Z" fill="#1d4ed8" opacity="0.5" />

    <!-- head -->
    <circle cx="100" cy="82" r="34" fill="#f8fafc" />
    <path d="M66 78 C66 56 80 44 100 44 C120 44 134 56 134 78 C134 66 120 60 100 60 C80 60 66 66 66 78 Z" fill="#334155" />

    <!-- spectacles, because he is a doctor of applied improbability -->
    <circle cx="88" cy="84" r="9" fill="none" stroke="#334155" stroke-width="2.5" />
    <circle cx="112" cy="84" r="9" fill="none" stroke="#334155" stroke-width="2.5" />
    <line x1="97" y1="84" x2="103" y2="84" stroke="#334155" stroke-width="2.5" />

    <!-- small satellite on the ring -->
    <circle cx="163" cy="63" r="6" fill="#2563eb" />
  </g>
</svg>
